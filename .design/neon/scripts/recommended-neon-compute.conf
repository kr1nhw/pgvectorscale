# Recommended Neon compute settings (append to the endpoint's postgresql.conf,
# i.e. $NEON_DATA/endpoints/<id>/postgresql.conf, then restart the endpoint).
#
# These are the knobs that took BIGANN-10M warm ivf-scan p50 from ~390 ms
# (Neon dev defaults) to ~5 ms (~vanilla-PG17 parity).  See
# RECOMMENDED-SETUP.md and .design/neon/bench/RESULTS.md.

# ---- replace defaults -----------------------------------------------------
shared_buffers=2GB
effective_io_concurrency=64

# ---- add ------------------------------------------------------------------
maintenance_work_mem=1GB
work_mem=64MB
max_parallel_maintenance_workers=8

# Neon local file cache: disabled by default (0); this is the single biggest
# win for warm reads — pages are served from the compute's local disk instead
# of round-tripping to the pageserver.
# max_file_cache_size is PGC_POSTMASTER (restart needed),
# file_cache_size_limit is PGC_SIGHUP (reload is enough, capped by the max).
neon.max_file_cache_size=8GB
neon.file_cache_size_limit=8GB
