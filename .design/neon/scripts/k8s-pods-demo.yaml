# Demo: Neon storage layer on Kubernetes — 3 pageservers + 3 safekeepers.
#
# Assumptions (see RECOMMENDED-SETUP.md):
#   - k3s containerd has the image docker.io/library/neon-storage:latest
#     (build with build_oci_image.py + `k3s ctr -n k8s.io images import`)
#   - hostPath dirs exist: $NEON_DATA/pageserver_{2,3,4} with identity.toml
#     (`id=N`) and pageserver.toml, $NEON_DATA/safekeepers/sk{4,5,6}
#   - the storage broker (127.0.0.1:50051) and storage controller
#     (127.0.0.1:1234) are already running (host or pods)
#
# All pods use hostNetwork so they bind host ports and reach the broker/
# controller exactly like the host processes.  imagePullPolicy must be
# IfNotPresent: the image exists only in the local containerd.
#
# Apply:  kubectl apply -f k8s-pods-demo.yaml
---
apiVersion: v1
kind: Pod
metadata:
  name: sk4
  namespace: default
spec:
  hostNetwork: true
  restartPolicy: Always
  containers:
  - name: sk4
    image: neon-storage:latest
    imagePullPolicy: IfNotPresent
    command: ["/usr/local/bin/safekeeper"]
    args: ["-D", "/data1/neon-test/.neon/safekeepers/sk4", "--id", "4",
           "--listen-pg", "127.0.0.1:5457", "--listen-http", "127.0.0.1:7679"]
    volumeMounts:
    - name: data
      mountPath: /data1/neon-test/.neon/safekeepers/sk4
  volumes:
  - name: data
    hostPath:
      path: /data1/neon-test/.neon/safekeepers/sk4
      type: DirectoryOrCreate
